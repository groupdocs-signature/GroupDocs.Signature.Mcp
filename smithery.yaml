# Smithery registry manifest — https://smithery.ai
# Publishing is a manual step (see the improvement plan, task M8): a maintainer with a
# Smithery account runs `smithery publish` or submits via the dashboard.
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      storagePath:
        type: string
        title: Storage path
        description: Base folder for input and output files. Defaults to the current working directory.
      licensePath:
        type: string
        title: License path
        description: Path to a GroupDocs license file. Leave empty to run in evaluation mode (limits documented in the README's Licensing section).
  commandFunction: |-
    (config) => ({
      command: "dnx",
      args: ["GroupDocs.Signature.Mcp", "--yes"],
      env: Object.assign({},
        config.storagePath ? { GROUPDOCS_MCP_STORAGE_PATH: config.storagePath } : {},
        config.licensePath ? { GROUPDOCS_LICENSE_PATH: config.licensePath } : {})
    })
